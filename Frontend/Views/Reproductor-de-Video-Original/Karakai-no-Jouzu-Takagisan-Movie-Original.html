<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor de Película / Episodio Único</title>
    <link rel="icon" type="image/png" href="../../image/Logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       RESET Y BASE — fondo original con overlay
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', 'Segoe UI', 'Roboto', sans-serif;
      background: url(https://static.wixstatic.com/media/8a7da0_da693a5c2b2d42bbb084707197421b0a~mv2.png) center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1a1a2e;
      position: relative;
    }

    /* Overlay suave */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      z-index: 0;
    }

    /* ============================================================
       CONTENEDOR PRINCIPAL — glassmorphism azulado
    ============================================================ */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.70);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(13, 71, 161, 0.20), inset 0 1px 0 rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 24px 28px;
      max-width: 900px;
      width: 94%;
      transition: all 0.3s ease;
    }

    /* ============================================================
       BARRA SUPERIOR (selectores)
    ============================================================ */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .top-bar select {
      padding: 10px 16px;
      padding-right: 36px;
      border-radius: 40px;
      border: 1px solid rgba(0,0,0,0.06);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a1a2e;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%230d47a1" d="M6 8L0 0h12z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 12px 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      min-width: 140px;
      flex: 1 1 auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .top-bar select:focus {
      outline: none;
      border-color: #0d47a1;
      box-shadow: 0 0 0 4px rgba(13, 71, 161, 0.08);
    }

    .top-bar select:hover {
      background-color: rgba(255, 255, 255, 0.95);
      border-color: #0d47a1;
    }

    .top-bar select option {
      background: #fff;
      color: #1a1a2e;
    }

    /* Indicador de servicio (badge) */
    .service-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      background: rgba(13, 71, 161, 0.06);
      color: #0d47a1;
      border: 1px solid rgba(13, 71, 161, 0.10);
      backdrop-filter: blur(4px);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }

    .service-indicator i {
      font-size: 0.85rem;
      color: #0288d1;
    }

    /* ============================================================
       REPRODUCTOR DE VIDEO
    ============================================================ */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      background: #000;
      position: relative;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 768px) {
      .container {
        padding: 18px 16px;
        border-radius: 24px;
        width: 98%;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .top-bar select {
        width: 100%;
        min-width: unset;
      }

      .service-indicator {
        align-self: center;
        font-size: 0.7rem;
        padding: 4px 14px 4px 10px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 14px 12px;
        border-radius: 20px;
      }

      .top-bar select {
        font-size: 0.75rem;
        padding: 8px 14px;
        padding-right: 32px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Barra superior con selectores de servidor y servicio -->
  <div class="top-bar">
    <select class="server-selector" id="serverSelector" onchange="changeServer(this.value)"></select>
    <select class="service-selector" id="serviceSelector" onchange="cambiarServicio(this.value)">
      <option value="firebase">Firebase</option>
      <option value="cloudflare">Cloudflare</option>
      <option value="sheets">Google Sheets</option>
      <option value="sqlserver">SQL Server</option>
    </select>
    <span class="service-indicator" id="serviceIndicator">
      <i class="fas fa-database"></i> Servicio: Firebase
    </span>
  </div>

  <div class="video-container" id="videoContainer"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script type="module" src="../../Config/config.js"></script>
<script type="module" src="../../Controllers/Reproductor Original/Karakai-no-Jouzu-Takagisan-Movie-Original.js"></script>
</body>
</html>
